# conda env create -f env.yml && conda activate gpu-anns-eval
# Set cuda-version to what your driver supports (`nvidia-smi` -> "CUDA Version").
name: gpu-anns-eval
channels:
  - rapidsai
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - cuda-version=12.9
  # search / ground truth / CAGRA + ScaleGANN shard builds
  - cuvs>=25.10
  - cupy
  - numpy
  - pyyaml
  - matplotlib
  - nvidia-ml-py
  # toolchain for Jasper / Tagore / ScaleGANN
  - cmake>=3.28
  - make
  - ninja
  - cxx-compiler
  - cuda-nvcc
  - cuda-cudart-dev
  - cuda-cccl
  - libcublas-dev
  - libcurand-dev
  - pybind11
  # ScaleGANN (vendored DiskANN): boost program_options, MKL, libaio, OpenMP
  - libboost-devel
  - mkl-devel
  - libaio
